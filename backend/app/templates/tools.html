<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الأدوات — مُستخلِص</title>
  <meta name="description" content="أدوات OCR عربية: استخراج النص، تحويل الخط اليدوي، الترجمة، استخراج الجداول إلى Excel، قراءة بطاقة الرقم القومي وجواز السفر، وملفات PDF قابلة للبحث.">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  {% include "_nav.html" %}

  <section class="section">
    <div class="container">
      <h1 style="text-align:center;font-size:clamp(26px,4vw,38px);font-weight:800">أدوات مُستخلِص</h1>
      <p class="section-sub">مجموعة أدوات OCR عربية مدعومة بالذكاء الاصطناعي — اختر الخدمة التي تحتاجها.</p>
      <div class="cards" style="grid-template-columns:repeat(3,1fr)">
        {% for slug, s in services.items() %}
        <a class="card tool-card" href="/tools/{{ slug }}">
          <div class="ico">{{ s.icon }}</div>
          <h3>{{ s.title }}
            {% if s.free %}<span class="tool-free">مجاني</span>{% endif %}
          </h3>
          <p>{{ s.desc }}</p>
        </a>
        {% endfor %}
      </div>
    </div>
  </section>
</body>
</html>
