<!DOCTYPE html>
<html lang="{{ lang or 'ar' }}" dir="{{ dir or 'rtl' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script nonce="{{ csp_nonce }}">
  (function () {
    var t;
    try { t = localStorage.getItem('mostakhles.theme'); } catch (e) {}
    if (t !== 'dark' && t !== 'light') {
      t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
  </script>
  <title>{{ title }} — مُستخلِص</title>
  <link rel="stylesheet" href="/static/css/style.css?v={{ asset_v() }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="lp-body">
  {% include "_lpheader.html" %}
  <section class="section">
    <div class="container narrow legal">
      <h1>{{ title }}</h1>
      <p class="legal-date">{{ 'Last updated' if lang == 'en' else 'آخر تحديث' }}: {{ updated if updated else ('May 2026' if lang == 'en' else 'مايو 2026') }}</p>
      {{ body | safe }}
    </div>
  </section>

  {% include "_lpfooter.html" ignore missing %}
</body>
</html>
